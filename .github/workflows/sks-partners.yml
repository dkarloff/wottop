name: Publish SKS partners safely
on:
  push:
    branches: [main]
    paths:
      - "templates/topscripts/main.tpl"
      - "templates/smartphone/main.tpl"
      - "assets/sks-partners/carousel.css"
      - "assets/sks-partners/carousel.js"
      - "tools/deploy-sks.py"
      - "tools/sks-deploy.json"
      - ".github/workflows/sks-partners.yml"
      - "tools/SKS-DEPLOY.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wottop-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, wottop-prod]
    timeout-minutes: 8
    steps:
      - name: Publish reviewed widget files with conflict checks and rollback
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d /tmp/sks-partners-XXXXXXXX)
          trap 'rm -rf -- "$stage"' EXIT
          git clone --no-checkout --depth=1 --filter=blob:none 'git@github.com:dkarloff/wottop.git' "$stage/repository"
          test "$(git -C "$stage/repository" rev-parse HEAD)" = "$GITHUB_SHA"
          for file in 'templates/topscripts/main.tpl' 'templates/smartphone/main.tpl' 'assets/sks-partners/carousel.css' 'assets/sks-partners/carousel.js' 'tools/deploy-sks.py' 'tools/sks-deploy.json'; do
            mkdir -p "$stage/$(dirname "$file")"
            git -C "$stage/repository" show "$GITHUB_SHA:$file" > "$stage/$file"
          done
          python3 "$stage/tools/deploy-sks.py" --source "$stage"
